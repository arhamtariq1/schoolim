# Local development stack. Production uses Supabase-hosted Postgres (Phase 0-1),
# then Railway-hosted Postgres. Both are plain Postgres - see ADR-0003.
services:
  postgres:
    image: postgres:17-alpine
    container_name: ilm-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ilm
      POSTGRES_PASSWORD: ilm_local_dev
      POSTGRES_DB: ilm
    ports:
      - '5433:5432'
    volumes:
      - ilm-pgdata:/var/lib/postgresql/data
      - ./tooling/docker/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ilm -d ilm']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: ilm-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - ilm-redisdata:/data

  mailhog:
    image: axllent/mailpit:latest
    container_name: ilm-mailpit
    restart: unless-stopped
    ports:
      - '1025:1025'
      - '8025:8025'

volumes:
  ilm-pgdata:
  ilm-redisdata:
